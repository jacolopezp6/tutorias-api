$kind: http-request
url: "{{baseUrl}}/api/tutorias/{{tutoriaId}}/participantes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estudianteId": {{estudianteId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('Rechaza inscripción duplicada', () => pm.response.to.have.status(409));
    language: text/javascript
order: 23000
