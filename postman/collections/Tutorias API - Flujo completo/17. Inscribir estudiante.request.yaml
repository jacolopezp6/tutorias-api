$kind: http-request
url: "{{baseUrl}}/api/tutorias/{{tutoriaId}}/participantes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estudianteId": {{estudianteId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Inscripción creada', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('participanteId', String(pm.response.json().id));
    language: text/javascript
order: 21000
